name: Build Tauri app

on:
  push:
    branches: [publish/production-tauri]
    paths:
      - "tauri-app/**"
      - ".github/workflows/tauri-build.yml"
  pull_request:
    paths:
      - "tauri-app/**"
      - ".github/workflows/tauri-build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # macos-latest is temporarily disabled: the build fails because
          # WebviewWindowBuilder::transparent() is gated behind tauri's
          # "macos-private-api" feature on macOS, which src-tauri/Cargo.toml
          # does not enable. Re-enable this entry once that is resolved --
          # either by turning on the feature (plus app.macOSPrivateApi in
          # tauri.conf.json, which rules out Mac App Store distribution) or
          # by dropping the transparent() call on macOS behind a #[cfg].
          # - platform: macos-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: yarn install --immutable

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: tauri-app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fp-qui-${{ matrix.platform }}
          path: |
            tauri-app/src-tauri/target/release/bundle
          if-no-files-found: ignore
